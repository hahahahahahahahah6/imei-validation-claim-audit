[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "imei-validation-claim-audit"
version = "0.1.0"
description = "Offline audit of documented device-identifier claims"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"

[project.scripts]
imei-validation-claim-audit = "imei_validation_claim_audit.audit:main"

[tool.setuptools.packages.find]
include = ["imei_validation_claim_audit*"]
